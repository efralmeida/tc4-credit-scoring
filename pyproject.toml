[tool.poetry]
package-mode = false

[project]
name = "tc4-credit-scoring"
version = "0.1.0"
description = "Observabilidade, drift e governanca de um modelo de credit scoring."
authors = [
    {name = "Eduardo Almeida"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pandas (>=2.2)",
    "numpy (>=2.0)",
    "matplotlib (>=3.9)",
    "seaborn (>=0.13)",
    "jupyter (>=1.1)",
    "ipykernel (>=6.29)",
    "scikit-learn (>=1.5)",
    "pandera[pandas] (>=0.22)",
    "joblib (>=1.4)",
    "scipy (>=1.13)",
    "evidently (>=0.7,<0.8)"
]

[dependency-groups]
dev = [
    "pytest (>=8.3)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
